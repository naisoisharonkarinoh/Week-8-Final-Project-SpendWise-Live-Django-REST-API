<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SpendWise Dashboard</title>
  </head>
  <body>
    <h1>SpendWise</h1>

    <div id="login">
      <h2>Login</h2>
      <input id="username" placeholder="username" />
      <input id="password" placeholder="password" type="password" />
      <button id="btnLogin">Login</button>
    </div>

    <div id="app" style="display:none">
      <p>Logged in as <span id="who"></span> <button id="logout">Logout</button></p>

      <div>
        <input id="search" placeholder="Search description" />
        <button data-cat="" class="cat">All</button>
        <button data-cat="Food" class="cat">Food</button>
        <button data-cat="Transport" class="cat">Transport</button>
        <button data-cat="Bills" class="cat">Bills</button>
        <button id="btnSearch">Search</button>
      </div>

      <h3>Add Expense</h3>
      <input id="amount" placeholder="amount" />
      <input id="description" placeholder="description" />
      <input id="category" placeholder="category" />
      <button id="add">Add</button>

      <h3>Expenses</h3>
      <ul id="list"></ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
